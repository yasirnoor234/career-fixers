<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152B52"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle brand border & rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#cf-grad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2563EB" stroke-width="6" stroke-opacity="0.35"/>
  <!-- CF Monogram with precise optical alignment -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', Helvetica, Arial, sans-serif"
        font-weight="900" font-size="240" fill="#FFFFFF" letter-spacing="-6">CF</text>
</svg>